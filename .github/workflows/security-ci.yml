name: security-ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "20 3 * * 1"

jobs:
  dotnet-vulnerabilities:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: DBA_GameBackend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet restore GameBackend.sln
      - name: Check vulnerable NuGet packages
        shell: bash
        run: |
          set -euo pipefail
          dotnet list GameBackend.sln package --vulnerable --include-transitive 2>&1 | tee vulnerability-report.txt
          if grep -Eiq 'has the following vulnerable packages|critical|high|moderate|low' vulnerability-report.txt; then
            echo "Vulnerable NuGet packages detected."
            exit 1
          fi
      - name: Upload NuGet vulnerability report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-ci-nuget-vulnerability-report
          path: DBA_GameBackend/vulnerability-report.txt
          if-no-files-found: error
          retention-days: 30

  npm-audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - DBA_GameAdmin
          - DBA_GameWebsite
          - DBA_GameLauncher
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - run: npm ci
      - name: Check production npm vulnerabilities
        shell: bash
        run: npm audit --omit=dev --audit-level=high --json > npm-audit-report.json
      - name: Upload npm audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-ci-npm-audit-${{ matrix.app }}
          path: ${{ matrix.app }}/npm-audit-report.json
          if-no-files-found: error
          retention-days: 30

  container-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    defaults:
      run:
        working-directory: DBA_GameBackend
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f Game.Api/Dockerfile -t dba-game-api:${{ github.sha }} .
      - name: Build Worker image
        run: docker build -f Game.Worker/Dockerfile -t dba-game-worker:${{ github.sha }} .
      - name: Scan API image
        uses: aquasecurity/trivy-action@0.31.0
        with:
          image-ref: dba-game-api:${{ github.sha }}
          format: sarif
          output: trivy-api.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"
      - name: Upload API scan results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-api.sarif
      - name: Archive API Trivy SARIF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-ci-trivy-api-sarif
          path: DBA_GameBackend/trivy-api.sarif
          if-no-files-found: error
          retention-days: 30
      - name: Scan Worker image
        uses: aquasecurity/trivy-action@0.31.0
        with:
          image-ref: dba-game-worker:${{ github.sha }}
          format: sarif
          output: trivy-worker.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"
      - name: Upload Worker scan results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-worker.sarif
      - name: Archive Worker Trivy SARIF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-ci-trivy-worker-sarif
          path: DBA_GameBackend/trivy-worker.sarif
          if-no-files-found: error
          retention-days: 30
