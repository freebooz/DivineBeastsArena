name: solution-ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: DBA_GameBackend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet restore GameBackend.sln
      - run: dotnet build GameBackend.sln --no-restore
      - run: dotnet test GameBackend.sln --no-build
      - run: docker compose --env-file .env.example config

  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: DBA_GameAdmin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: DBA_GameAdmin/package-lock.json
      - run: npm ci
      - run: npm run build

  website:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: DBA_GameWebsite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: DBA_GameWebsite/package-lock.json
      - run: npm ci
      - run: npm run build

  launcher:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: DBA_GameLauncher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: DBA_GameLauncher/package-lock.json
      - uses: dtolnay/rust-action@stable
      - run: npm ci
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: cargo check --manifest-path src-tauri/Cargo.toml

  evidence-structure:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install production evidence test dependencies
        shell: pwsh
        run: python -m pip install pyyaml
      - name: Test production evidence automation
        shell: pwsh
        run: .\scripts\test-production-evidence-automation.ps1
      - name: Upload production evidence test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: production-evidence-test-diagnostics
          path: .tmp
          if-no-files-found: ignore
          retention-days: 14
