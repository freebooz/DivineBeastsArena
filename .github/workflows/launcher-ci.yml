name: launcher-ci

on:
  push:
    paths:
      - "DBA_GameLauncher/**"
      - ".github/workflows/launcher-ci.yml"
  pull_request:
    paths:
      - "DBA_GameLauncher/**"

jobs:
  launcher:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: DBA_GameLauncher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: DBA_GameLauncher/package-lock.json
      - uses: dtolnay/rust-action@stable
      - run: npm ci
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: cargo check --manifest-path src-tauri/Cargo.toml
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: DBA_GameLauncher
      - uses: actions/upload-artifact@v4
        with:
          name: game-launcher
          path: DBA_GameLauncher/src-tauri/target/release/bundle
