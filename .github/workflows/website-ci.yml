name: website-ci

on:
  push:
    paths:
      - "DBA_GameWebsite/**"
      - ".github/workflows/website-ci.yml"
  pull_request:
    paths:
      - "DBA_GameWebsite/**"

jobs:
  website:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: DBA_GameWebsite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: DBA_GameWebsite/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
