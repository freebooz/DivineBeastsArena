name: client-release-evidence

on:
  workflow_dispatch:
    inputs:
      package_root:
        description: "Public Windows client package root on the self-hosted runner"
        required: true
        default: ".tmp/client-release/public/release-candidate"
      run_id:
        description: "Evidence run id; leave empty to use GitHub run id"
        required: false
        default: ""
      evidence_root:
        description: "Evidence output directory"
        required: true
        default: "Artifacts/ProductionEvidence"
      version:
        description: "Client release version"
        required: true
        default: "0.1.0.0"
      download_url:
        description: "Production HTTPS CDN download URL ending with /"
        required: true
        default: "https://cdn.example.com/releases/0.1.0.0/"
      manifest_url:
        description: "Production HTTPS CDN launcher-manifest.json URL"
        required: true
        default: "https://cdn.example.com/releases/0.1.0.0/launcher-manifest.json"
      prepare_cdn_payload:
        description: "Prepare CDN upload payload before smoke"
        required: true
        type: boolean
        default: true
      payload_root:
        description: "CDN upload payload output directory; leave empty for script default"
        required: false
        default: ""
      run_local_cdn_payload_smoke:
        description: "Run localhost payload smoke before real CDN smoke"
        required: true
        type: boolean
        default: true
      run_cdn_smoke:
        description: "Run real HTTPS CDN smoke against manifest_url"
        required: true
        type: boolean
        default: false
      capture_launcher_ui:
        description: "Build launcher UI and capture screenshot/DOM evidence"
        required: true
        type: boolean
        default: true
      sign_package:
        description: "Sign public package before collecting signing evidence"
        required: true
        type: boolean
        default: false
      certificate_thumbprint:
        description: "Code-signing certificate thumbprint; optional when using subject or PFX"
        required: false
        default: ""
      certificate_subject:
        description: "Code-signing certificate subject; optional when using thumbprint or PFX"
        required: false
        default: ""
      pfx_path:
        description: "PFX path on runner; optional when using certificate store"
        required: false
        default: ""
      require_signed:
        description: "Fail unless code-signing evidence is release-ready"
        required: true
        type: boolean
        default: true
      require_ready:
        description: "Fail final release readiness report if any production gate is incomplete"
        required: true
        type: boolean
        default: true

jobs:
  client-release-evidence:
    name: Client release evidence
    runs-on:
      - self-hosted
      - Windows
      - ClientRelease
    env:
      DBA_CODE_SIGNING_PFX_PASSWORD: ${{ secrets.DBA_CODE_SIGNING_PFX_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Run client release prerequisite gate and evidence bundle
        shell: pwsh
        run: |
          $runId = "${{ inputs.run_id }}"
          if ([string]::IsNullOrWhiteSpace($runId)) {
            $runId = "client-release-gha-${{ github.run_id }}-${{ github.run_attempt }}"
          }

          $evidenceRoot = "${{ inputs.evidence_root }}"
          $clientEvidenceDir = Join-Path $evidenceRoot "client"
          New-Item -ItemType Directory -Force -Path $clientEvidenceDir | Out-Null
          $runnerDiagnosticPath = Join-Path $clientEvidenceDir ("client-release-runner-diagnostic-{0}.json" -f $runId)
          $prerequisitePath = Join-Path $clientEvidenceDir ("client-release-prerequisites-{0}.json" -f $runId)

          $runnerArgs = @{
            PackageRoot = "${{ inputs.package_root }}"
            DownloadUrl = "${{ inputs.download_url }}"
            ManifestUrl = "${{ inputs.manifest_url }}"
            JsonOutputPath = $runnerDiagnosticPath
          }
          if ("${{ inputs.sign_package }}" -ne "true" -and "${{ inputs.require_signed }}" -ne "true") {
            $runnerArgs.SkipSigningProbe = $true
          }
          if (-not [string]::IsNullOrWhiteSpace("${{ inputs.certificate_thumbprint }}")) {
            $runnerArgs.CertificateThumbprint = "${{ inputs.certificate_thumbprint }}"
          }
          if (-not [string]::IsNullOrWhiteSpace("${{ inputs.certificate_subject }}")) {
            $runnerArgs.CertificateSubject = "${{ inputs.certificate_subject }}"
          }
          if (-not [string]::IsNullOrWhiteSpace("${{ inputs.pfx_path }}")) {
            $runnerArgs.PfxPath = "${{ inputs.pfx_path }}"
          }
          .\scripts\diagnose-client-release-runner.ps1 @runnerArgs

          $prereqArgs = @{
            PackageRoot = "${{ inputs.package_root }}"
            DownloadUrl = "${{ inputs.download_url }}"
            ManifestUrl = "${{ inputs.manifest_url }}"
            RequireManifestUrl = $true
            OutputJsonPath = $prerequisitePath
            FailOnBlockingIssues = $true
          }

          if ("${{ inputs.sign_package }}" -eq "true" -or "${{ inputs.require_signed }}" -eq "true") {
            $prereqArgs.RequireSigningIdentity = $true
            $prereqArgs.RequireSignTool = $true
            $prereqArgs.PfxPasswordEnvironmentVariable = "DBA_CODE_SIGNING_PFX_PASSWORD"
          }
          if (-not [string]::IsNullOrWhiteSpace("${{ inputs.certificate_thumbprint }}")) {
            $prereqArgs.CertificateThumbprint = "${{ inputs.certificate_thumbprint }}"
          }
          if (-not [string]::IsNullOrWhiteSpace("${{ inputs.certificate_subject }}")) {
            $prereqArgs.CertificateSubject = "${{ inputs.certificate_subject }}"
          }
          if (-not [string]::IsNullOrWhiteSpace("${{ inputs.pfx_path }}")) {
            $prereqArgs.PfxPath = "${{ inputs.pfx_path }}"
          }

          .\scripts\diagnose-client-release-prerequisites.ps1 @prereqArgs

          $bundleArgs = @{
            PackageRoot = "${{ inputs.package_root }}"
            EvidenceRoot = $evidenceRoot
            RunId = $runId
            Version = "${{ inputs.version }}"
            BuildConfiguration = "Shipping"
            DownloadUrl = "${{ inputs.download_url }}"
            ManifestUrl = "${{ inputs.manifest_url }}"
          }

          if ("${{ inputs.prepare_cdn_payload }}" -eq "true") {
            $bundleArgs.PrepareCdnPayload = $true
          }
          if (-not [string]::IsNullOrWhiteSpace("${{ inputs.payload_root }}")) {
            $bundleArgs.PayloadRoot = "${{ inputs.payload_root }}"
          }
          if ("${{ inputs.run_local_cdn_payload_smoke }}" -eq "true") {
            $bundleArgs.RunLocalCdnPayloadSmoke = $true
          }
          if ("${{ inputs.run_cdn_smoke }}" -ne "true") {
            $bundleArgs.SkipCdnSmoke = $true
          }
          if ("${{ inputs.capture_launcher_ui }}" -eq "true") {
            $bundleArgs.CaptureLauncherUiEvidence = $true
          }
          if ("${{ inputs.sign_package }}" -eq "true") {
            $bundleArgs.SignPackage = $true
            $bundleArgs.PfxPasswordEnvironmentVariable = "DBA_CODE_SIGNING_PFX_PASSWORD"
          }
          if (-not [string]::IsNullOrWhiteSpace("${{ inputs.certificate_thumbprint }}")) {
            $bundleArgs.CertificateThumbprint = "${{ inputs.certificate_thumbprint }}"
          }
          if (-not [string]::IsNullOrWhiteSpace("${{ inputs.certificate_subject }}")) {
            $bundleArgs.CertificateSubject = "${{ inputs.certificate_subject }}"
          }
          if (-not [string]::IsNullOrWhiteSpace("${{ inputs.pfx_path }}")) {
            $bundleArgs.PfxPath = "${{ inputs.pfx_path }}"
          }
          if ("${{ inputs.require_signed }}" -eq "true") {
            $bundleArgs.RequireSigned = $true
          }

          .\scripts\run-client-release-evidence.ps1 @bundleArgs
          .\scripts\collect-production-evidence.ps1 -EvidenceRoot $evidenceRoot

          .\scripts\write-release-readiness-report.ps1 -EvidenceRoot $evidenceRoot
          $readinessReportPath = Join-Path $evidenceRoot "release-readiness-report.json"
          $blockerActionsPath = Join-Path $evidenceRoot "release-blocker-actions.json"
          $inputTemplatePath = Join-Path $evidenceRoot "release-input-template.json"
          $inputValuesTemplatePath = Join-Path $evidenceRoot "release-input-values.template.json"
          $commandPlanTemplatePath = Join-Path $evidenceRoot "release-command-plan.template-check.json"
          $commandPlanTemplateMarkdownPath = Join-Path $evidenceRoot "release-command-plan.template-check.md"

          .\scripts\diagnose-release-blockers.ps1 -ReportPath $readinessReportPath
          .\scripts\validate-release-blocker-actions.ps1 -ActionReportPath $blockerActionsPath -RequireValid
          .\scripts\validate-release-blockers-external-only.ps1 -ActionReportPath $blockerActionsPath -RequireValid
          .\scripts\write-release-readiness-report.ps1 -EvidenceRoot $evidenceRoot
          .\scripts\validate-development-continuation-readiness.ps1 -ReadinessReportPath $readinessReportPath -RequireReady
          .\scripts\write-release-input-template.ps1 -ActionReportPath $blockerActionsPath
          .\scripts\validate-release-input-template.ps1 -TemplatePath $inputTemplatePath -RequireValid
          .\scripts\write-release-input-values-template.ps1 -TemplatePath $inputTemplatePath
          .\scripts\validate-release-input-values.ps1 -ValuesPath $inputValuesTemplatePath
          .\scripts\resolve-release-input-template.ps1 -TemplatePath $inputTemplatePath -ValuesPath $inputValuesTemplatePath -OutputJsonPath $commandPlanTemplatePath -OutputMarkdownPath $commandPlanTemplateMarkdownPath

          if ("${{ inputs.require_ready }}" -eq "true") {
            .\scripts\write-release-readiness-report.ps1 -EvidenceRoot $evidenceRoot -RequireReady
          }

      - name: Upload client release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-release-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ inputs.evidence_root }}
          if-no-files-found: error
