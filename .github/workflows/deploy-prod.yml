name: deploy-prod

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Docker image tag to deploy
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_SSH_PORT }}
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"
            ENV_FILE="DBA_GameBackend/.env"
            COMPOSE="docker compose --env-file ${ENV_FILE} -f DBA_GameBackend/docker-compose.yml"
            NEW_IMAGE_TAG="${{ github.event.inputs.image_tag }}"
            PREVIOUS_IMAGE_TAG="$(grep -E '^IMAGE_TAG=' "${ENV_FILE}" | tail -n 1 | cut -d= -f2- || true)"
            PREVIOUS_IMAGE_TAG="${PREVIOUS_IMAGE_TAG:-latest}"

            rollback() {
              echo "Deploy failed, rolling back to image tag ${PREVIOUS_IMAGE_TAG}."
              export IMAGE_TAG="${PREVIOUS_IMAGE_TAG}"
              ${COMPOSE} up -d || true
              sleep 20 || true
              curl -f http://localhost:8080/health/live || true
            }
            trap rollback ERR

            bash DBA_GameBackend/scripts/backup-postgres.sh || true
            export IMAGE_TAG="${NEW_IMAGE_TAG}"
            ${COMPOSE} pull
            bash DBA_GameBackend/scripts/migrate-db.sh
            ${COMPOSE} up -d
            sleep 20
            curl -f http://localhost:8080/health/live

            if grep -qE '^IMAGE_TAG=' "${ENV_FILE}"; then
              sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=${NEW_IMAGE_TAG}/" "${ENV_FILE}"
            else
              printf '\nIMAGE_TAG=%s\n' "${NEW_IMAGE_TAG}" >> "${ENV_FILE}"
            fi
            trap - ERR
