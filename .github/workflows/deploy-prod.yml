name: deploy-prod

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_SSH_PORT }}
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"
            bash DBA_GameBackend/scripts/backup-postgres.sh || true
            docker compose --env-file DBA_GameBackend/.env -f DBA_GameBackend/docker-compose.yml pull
            bash DBA_GameBackend/scripts/migrate-db.sh
            docker compose --env-file DBA_GameBackend/.env -f DBA_GameBackend/docker-compose.yml up -d
            sleep 20
            curl -f http://localhost:8080/health/live
