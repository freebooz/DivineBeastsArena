name: backend-ci

on:
  push:
    paths:
      - "DBA_GameBackend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "DBA_GameBackend/**"

jobs:
  backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: DBA_GameBackend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet restore GameBackend.sln
      - run: dotnet build GameBackend.sln --no-restore
      - run: dotnet test GameBackend.sln --no-build
      - name: Docker build API
        run: docker build -f Game.Api/Dockerfile -t ghcr.io/${{ github.repository }}/game-api:${{ github.sha }} .
      - name: Docker build Worker
        run: docker build -f Game.Worker/Dockerfile -t ghcr.io/${{ github.repository }}/game-worker:${{ github.sha }} .
      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push images
        if: github.event_name == 'push'
        run: |
          docker push ghcr.io/${{ github.repository }}/game-api:${{ github.sha }}
          docker push ghcr.io/${{ github.repository }}/game-worker:${{ github.sha }}
