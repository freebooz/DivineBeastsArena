groups:
  - name: game_api
    rules:
      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High error rate detected"

      - alert: HighLatency
        expr: histogram_quantile(0.95, http_request_duration_seconds_bucket[5m]) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High latency detected"

  - name: game_servers
    rules:
      - alert: ServerDown
        expr: up{job="game-servers"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Game server is down"

  - name: database
    rules:
      - alert: PostgresDown
        expr: pg_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL is down"