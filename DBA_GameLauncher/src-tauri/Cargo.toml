[package]
name = "dba-game-launcher"
version = "0.1.0"
description = "Divine Beasts Arena game launcher and updater"
authors = ["Divine Beasts Arena"]
edition = "2021"

[lib]
name = "game_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"
sha2 = "0.10"
hex = "0.4"
semver = "1"
opener = "0.7"
