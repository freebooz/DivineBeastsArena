# DBA_GameBackend Docker Compose - 开发环境
# 开发环境基础服务：Game.Api + PostgreSQL + Redis；Worker 通过 separate Profile 按需独立启动。

services:
  # ========== 默认 API 容器 ==========
  game-backend:
    build:
      context: .
      dockerfile: Dockerfile.single
    container_name: game-backend
    expose:
      - "8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      # 数据库 - 连接到docker-compose内的postgres
      - Database__ConnectionString=Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Include Error Detail=false
      # Redis - 连接到docker-compose内的redis
      - Redis__ConnectionString=redis:6379,password=${REDIS_PASSWORD},abortConnect=false
      # JWT配置
      - Jwt__Secret=${JWT_SECRET}
      - Jwt__Issuer=${JWT_ISSUER}
      - Jwt__Audience=${JWT_AUDIENCE}
      - Jwt__AccessTokenExpiryMinutes=15
      - Jwt__RefreshTokenExpiryDays=30
      - InternalApi__Key=${INTERNAL_API_KEY}
      # 数据种子（开发环境启用）
      - SeedData__Enabled=true
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      - game-network

  # 仅执行现有 GameDbContext 的 EF migration；不创建第二个 DbContext。
  db-migrate:
    build:
      context: .
      dockerfile: Dockerfile.single
    container_name: game-db-migrate
    entrypoint: ["dotnet", "/app/api/Game.Api.dll"]
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Database__RunMigrationsAndExit=true
      - Database__ConnectionString=Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Include Error Detail=false
      - Redis__ConnectionString=redis:6379,password=${REDIS_PASSWORD},abortConnect=false
      - Jwt__Secret=${JWT_SECRET}
      - Jwt__Issuer=${JWT_ISSUER}
      - Jwt__Audience=${JWT_AUDIENCE}
      - InternalApi__Key=${INTERNAL_API_KEY}
      - SeedData__Enabled=false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"
    networks:
      - game-network

  # 网关只处理路由、限流、关联标识、日志与健康检查；不承载游戏角色业务。
  dba-api-gateway:
    build:
      context: .
      dockerfile: DBA.ApiGateway/Dockerfile
    container_name: dba-api-gateway
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ReverseProxy__Clusters__game-api__Destinations__game-api-primary__Address=http://game-backend:8080/
    depends_on:
      game-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - game-network

  # ========== 分离容器方案（可选） ==========
  # 游戏API服务
  game-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: game-api
    profiles:
      - separate
    expose:
      - "8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - Database__ConnectionString=Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Include Error Detail=false
      - Redis__ConnectionString=redis:6379,password=${REDIS_PASSWORD},abortConnect=false
      - Jwt__Secret=${JWT_SECRET}
      - Jwt__Issuer=${JWT_ISSUER}
      - Jwt__Audience=${JWT_AUDIENCE}
      - InternalApi__Key=${INTERNAL_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - game-network

  # 游戏Worker服务
  game-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: game-worker
    profiles:
      - separate
    environment:
      - Database__ConnectionString=Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Include Error Detail=false
      - Redis__ConnectionString=redis:6379,password=${REDIS_PASSWORD},abortConnect=false
      - InternalApi__Key=${INTERNAL_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - game-network

  # ========== 数据库服务 ==========
  postgres:
    image: postgres:16-alpine
    container_name: game-postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - game-network

  # Redis缓存
  redis:
    image: redis:7-alpine
    container_name: game-redis
    command: ["sh", "-c", "redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""]
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - game-network

# ========== 网络和卷 ==========
volumes:
  postgres-data:
  redis-data:

networks:
  game-network:
    driver: bridge
