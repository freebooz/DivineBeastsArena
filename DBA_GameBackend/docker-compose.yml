name: divine-beasts-arena

services:
  game-api:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-your-github-org-or-user}/game-api:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Game.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: ${ASPNETCORE_URLS:-http://+:8080}
      Database__ConnectionString: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Include Error Detail=false
      Redis__ConnectionString: redis:6379,password=${REDIS_PASSWORD},abortConnect=false
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Jwt__Secret: ${JWT_SECRET}
      InternalApi__Key: ${INTERNAL_API_KEY}
      SeedData__Enabled: ${SEED_DATA_ENABLED:-false}
      Swagger__Enabled: ${SWAGGER_ENABLED:-false}
    expose:
      - "8080"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - game-public
      - game-internal

  game-worker:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-your-github-org-or-user}/game-worker:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Game.Worker/Dockerfile
    environment:
      DOTNET_ENVIRONMENT: ${DOTNET_ENVIRONMENT:-Production}
      Database__ConnectionString: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Include Error Detail=false
      Redis__ConnectionString: redis:6379,password=${REDIS_PASSWORD},abortConnect=false
      InternalApi__Key: ${INTERNAL_API_KEY}
      GameServerManager__ServerMode: ${GAME_SERVER_MODE:-LocalProcess}
      GameServerManager__PublicIp: ${GAME_SERVER_PUBLIC_IP:-127.0.0.1}
      GameServerManager__PortRangeStart: ${GAME_SERVER_PORT_START:-7777}
      GameServerManager__PortRangeEnd: ${GAME_SERVER_PORT_END:-7877}
      GameServerManager__UeServerExecutablePath: ${UE_SERVER_EXECUTABLE_PATH:-/opt/game-server/GameServer.sh}
      GameServerManager__BackendUrl: ${BACKEND_INTERNAL_URL:-http://game-api:8080}
    depends_on:
      game-api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - game-internal

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - game-internal

  redis:
    image: redis:7-alpine
    command: ["sh", "-c", "redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - game-internal

volumes:
  postgres-data:
  redis-data:

networks:
  game-public:
    driver: bridge
  game-internal:
    driver: bridge
    internal: true
