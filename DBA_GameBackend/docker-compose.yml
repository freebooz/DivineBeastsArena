# DBA_GameBackend Docker Compose Configuration
# 统一打包运行 Game.Api 和 Game.Worker

services:
  # 游戏后台API服务
  game-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: game-api
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - Database__ConnectionString=Host=postgres;Database=gamedb;Username=postgres;Password=postgres
      - Redis__ConnectionString=redis:6379
      - Jwt__Secret=your-secret-key-min-32-chars-long!!
      - Jwt__Issuer=GameApi
      - Jwt__Audience=GameClients
      - SeedData__Enabled=false
    depends_on:
      - postgres
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - game-network

  # 游戏服务器管理Worker服务
  game-worker:
    build:
      context: .
      dockerfile: Dockerfile-worker
    container_name: game-worker
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - Database__ConnectionString=Host=postgres;Database=gamedb;Username=postgres;Password=postgres
      - Redis__ConnectionString=redis:6379
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    networks:
      - game-network

  # PostgreSQL数据库
  postgres:
    image: postgres:16
    container_name: game-postgres
    environment:
      - POSTGRES_DB=gamedb
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - game-network

  # Redis缓存
  redis:
    image: redis:7-alpine
    container_name: game-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - game-network

volumes:
  postgres-data:
  redis-data:

networks:
  game-network:
    driver: bridge