global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  - job_name: game-api
    metrics_path: /metrics
    static_configs:
      - targets:
          - game-api:8080

  - job_name: node-exporter
    static_configs:
      - targets:
          - node-exporter:9100
