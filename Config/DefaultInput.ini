[/Script/Engine.InputSettings]
; ========================================
; 输入设置
; ========================================

; 默认玩家输入类
DefaultPlayerInputClass=/Script/EnhancedInput.EnhancedPlayerInput

; 默认输入组件类
DefaultInputComponentClass=/Script/EnhancedInput.EnhancedInputComponent

; 默认触摸接口
DefaultTouchInterface=/Engine/MobileResources/HUD/DefaultVirtualJoysticks.DefaultVirtualJoysticks

; 控制台键
-ConsoleKeys=Tilde
+ConsoleKeys=Tilde
+ConsoleKeys=Caret

; Lobby/gameplay movement. Keep these separate from skill cast keys.
+AxisMappings=(AxisName="MoveForward",Scale=1.000000,Key=W)
+AxisMappings=(AxisName="MoveForward",Scale=-1.000000,Key=S)
+AxisMappings=(AxisName="MoveForward",Scale=1.000000,Key=Up)
+AxisMappings=(AxisName="MoveForward",Scale=-1.000000,Key=Down)
+AxisMappings=(AxisName="MoveRight",Scale=1.000000,Key=D)
+AxisMappings=(AxisName="MoveRight",Scale=-1.000000,Key=A)
+AxisMappings=(AxisName="MoveRight",Scale=1.000000,Key=Right)
+AxisMappings=(AxisName="MoveRight",Scale=-1.000000,Key=Left)
+AxisMappings=(AxisName="Turn",Scale=1.000000,Key=MouseX)
+AxisMappings=(AxisName="LookUp",Scale=-1.000000,Key=MouseY)

; Skill casts use number keys so they never steal WASD or arrow movement.
+ActionMappings=(ActionName="Skill01",bShift=False,bCtrl=False,bAlt=False,bCmd=False,Key=One)
+ActionMappings=(ActionName="Skill02",bShift=False,bCtrl=False,bAlt=False,bCmd=False,Key=Two)
+ActionMappings=(ActionName="Skill03",bShift=False,bCtrl=False,bAlt=False,bCmd=False,Key=Three)
+ActionMappings=(ActionName="Skill04",bShift=False,bCtrl=False,bAlt=False,bCmd=False,Key=Four)
+ActionMappings=(ActionName="Ultimate",bShift=False,bCtrl=False,bAlt=False,bCmd=False,Key=Five)


[/Script/EnhancedInput.EnhancedInputDeveloperSettings]
; ========================================
; 增强输入开发者设置
; ========================================

; 默认输入映射上下文（后续在第 18 部分详细配置）
; +DefaultMappingContexts=(InputMappingContext="/Game/Input/IMC_Default.IMC_Default",Priority=0)

; 输入日志
bEnableInputLogging=False

; 输入调试
bEnableInputDebugging=False


[/Script/Engine.PlayerInput]
; ========================================
; 玩家输入设置
; ========================================

; 鼠标灵敏度
MouseSensitivity=1.0

; 鼠标平滑
bEnableMouseSmoothing=True

; 鼠标加速
bViewAccelerationEnabled=False


[/Script/Engine.TouchInterface]
; ========================================
; 触摸接口设置（Android）
; ========================================

; 触摸接口
bShowConsoleOnFourFingerTap=True
