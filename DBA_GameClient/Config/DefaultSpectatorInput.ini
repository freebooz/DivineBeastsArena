; ========================================
; 观战系统输入配置
; ========================================
; 此文件定义了观战系统的输入绑定
; 实际配置需要在 UE 编辑器中通过 Input Mapping Context (IMC) 完成
;
; 配置步骤:
; 1. 在 UE 编辑器中打开项目设置
; 2. 找到 Input 页面
; 3. 创建或编辑 Input Mapping Context
; 4. 添加以下输入映射
; ========================================

; --- 观战输入 Action 定义 ---

; Spectator_CycleNext - Tab键 - 切换到下一个玩家
; 触发: 按下 Tab
; 说明: 循环切换到下一个可观察的玩家

; Spectator_CyclePrevious - Shift+Tab - 切换到上一个玩家
; 触发: 按下 Shift+Tab
; 说明: 循环切换到上一个可观察的玩家

; Spectator_ToggleFreeView - Space键 - 切换自由视角
; 触发: 按下 Space
; 说明: 在跟随视角和自由视角之间切换

; Spectator_TogglePause - P键 - 暂停/恢复
; 触发: 按下 P
; 说明: 暂停或恢复比赛 (需要相应权限)

; Spectator_NumericSwitch_1~9 - 数字键1-9 - 直接跳转
; 触发: 按下数字键
; 说明: 直接切换到指定索引的玩家

; Spectator_FreeLook_Move - WASD - 自由视角移动
; 触发: 按住 WASD
; 说明: 在自由视角下移动相机

; Spectator_FreeLook_Zoom - 鼠标滚轮 - 缩放
; 触发: 滚动鼠标
; 说明: 调整自由视角的缩放级别

; ========================================
; 示例 IMC 配置 (在 UE 编辑器中操作)
; ========================================

; 建议在 Content/Input/ 下创建新的 IMC:
; - IMC_Spectator: 观战模式专用输入映射上下文
;
; 优先级设置:
; - 观战模式应高于游戏模式，以确保观战输入优先响应
;
; 切换逻辑:
; - 当玩家进入观战模式时，激活 IMC_Spectator
; - 当玩家退出观战模式时，停用 IMC_Spectator
