global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: divine-beasts-arena
    environment: production

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: game-api
    metrics_path: /metrics
    static_configs:
      - targets: ["game-api:8080"]

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: loki
    metrics_path: /metrics
    static_configs:
      - targets: ["loki:3100"]
