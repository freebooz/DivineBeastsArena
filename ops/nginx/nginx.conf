worker_processes auto;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format json escape=json
        '{"time":"$time_iso8601","remote":"$remote_addr","method":"$request_method",'
        '"uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,'
        '"request_time":$request_time,"upstream":"$upstream_addr",'
        '"upstream_time":"$upstream_response_time","trace_id":"$http_x_trace_id"}';

    access_log /var/log/nginx/access.log json;
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 20m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Trace-Id $request_id;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    upstream game_api {
        server game-api:8080;
        keepalive 32;
    }

    upstream grafana {
        server grafana:3000;
    }

    server {
        listen 80;
        server_name _;

        location = /health/live {
            proxy_pass http://game_api/health/live;
        }

        location = /health/ready {
            proxy_pass http://game_api/health/ready;
        }

        location /api/ {
            proxy_pass http://game_api;
        }

        location /runtime/ {
            proxy_pass http://game_api;
        }

        location /hubs/ {
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_pass http://game_api;
        }

        # 内部接口默认不暴露给公网；如需运维访问，请通过 VPN 或堡垒机访问容器内网。
        location /internal/ {
            return 404;
        }

        # 指标接口默认不暴露公网，由 Prometheus 通过 Docker 内网抓取。
        location = /metrics {
            return 404;
        }

        location /grafana/ {
            proxy_pass http://grafana;
        }
    }
}
